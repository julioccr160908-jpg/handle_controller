[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "handcontrol"
version = "0.1.0"
description = "Control Windows with hand gestures captured by webcam"
requires-python = ">=3.11,<3.14"
dependencies = [
    "opencv-python>=4.8.0,<5.0",
    "mediapipe>=0.10.7,<0.11",
    "PySide6>=6.5.0,<6.9",
    "pydantic>=2.0,<3.0",
    "pyautogui>=0.9.54,<1.0",
    "PyWinCtl>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10.0",
    "ruff>=0.4.0,<1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
handcontrol = "handcontrol.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
